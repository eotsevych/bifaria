name: Build Bifaria (All Platforms)

# Pushes to main and pull requests build installers as workflow artifacts.
# Pushing a version tag (e.g. v0.1.0) also attaches them to a draft GitHub Release.
on:
  push:
    branches: [main]
    tags: ['v*']
    # Website-only changes do not need app builds (see pages.yml).
    paths-ignore: ['site/**', '.github/workflows/pages.yml']
  pull_request:
    paths-ignore: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # Optional secrets (see DEPLOYMENT.md). Builds still succeed without them, just unsigned for the updater.
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
  # Enables in-app updater artifacts (.sig files) only when the updater key is configured.
  UPDATER_CONFIG: '{"bundle":{"createUpdaterArtifacts":true}}'

jobs:
  create-release:
    name: Create draft release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify tag matches app version
        run: |
          APP_VERSION="$(jq -r .version src-tauri/tauri.conf.json)"
          if [ "v$APP_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $APP_VERSION in src-tauri/tauri.conf.json"
            exit 1
          fi

      - name: Create draft release
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --draft --title "Bifaria $GITHUB_REF_NAME" --generate-notes

  test:
    name: Lint, type-check and test
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type-check
        run: bun run typecheck

      # The Rust crate embeds the built frontend, so it has to exist before cargo compiles.
      - name: Build frontend
        run: bun run build

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --locked

  build-macos:
    name: Build macOS (Universal, Apple Silicon & Intel)
    needs: [create-release, test]
    if: ${{ !failure() && !cancelled() }}
    # The Apple Translation helper needs Xcode with the macOS 26 SDK.
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # MACOS_SIGNING_P12 holds the Developer ID Application certificate (or the older self-signed one).
      - name: Import signing certificate
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          if [ -z "$MACOS_SIGNING_P12" ]; then
            echo "::warning::MACOS_SIGNING_P12 not set; signing ad-hoc (macOS permissions reset on every update)."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/bifaria-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "$MACOS_SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/bifaria-signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/bifaria-signing.p12" -k "$KEYCHAIN" -P "$MACOS_SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # codesign only finds the private key in keychains on the user search list.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/bifaria-signing.p12"
          echo "BIFARIA_SIGN_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Build macOS installers
        env:
          # Fail instead of shipping the Apple translation provider without its helper.
          BIFARIA_REQUIRE_APPLE_TRANSLATE: "1"
          # And without the Neural Engine speech recognition helper (Parakeet on Apple Silicon).
          BIFARIA_REQUIRE_APPLE_ASR: "1"
          BIFARIA_REQUIRE_ENGINE: "1"
          # Notarization (skipped when unset) with an App Store Connect API key.
          # Only on release tags and manual runs; it adds ~15 minutes.
          APPLE_API_KEY: ${{ (env.IS_RELEASE == 'true' || github.event_name == 'workflow_dispatch') && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: bash scripts/build_installers.sh

      - name: Upload macOS installers
        uses: actions/upload-artifact@v4
        with:
          name: bifaria-macos-installers
          path: |
            installers/*.dmg
            installers/*.app.tar.gz
            installers/*.app.tar.gz.sig
          if-no-files-found: error

      - name: Attach to release
        if: env.IS_RELEASE == 'true'
        run: |
          shopt -s nullglob
          gh release upload "$GITHUB_REF_NAME" installers/*.dmg installers/*.app.tar.gz installers/*.app.tar.gz.sig --clobber

  build-windows:
    name: Build Windows (.exe & .msi)
    needs: [create-release, test]
    if: ${{ !failure() && !cancelled() }}
    runs-on: windows-latest
    # Whisper's Vulkan build nests deep CMake folders that pass Windows' 260-character path limit
    # under D:\a\Bifaria\Bifaria\src-tauri\target, so cargo builds in a short folder instead.
    env:
      CARGO_TARGET_DIR: C:\t
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            src-tauri/engine -> C:/te

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # Whisper's Vulkan GPU backend builds against the Vulkan SDK. The Vulkan loader (vulkan-1.dll)
      # ships next to Bifaria.exe, so the app also starts on PCs without one and uses the CPU there.
      - name: Install Vulkan SDK
        shell: pwsh
        env:
          VULKAN_VERSION: 1.4.313.2
        run: |
          curl.exe -o "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" -L "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_VERSION.exe"
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install
          $sdk = "C:\VulkanSDK\$env:VULKAN_VERSION"
          if (-not (Test-Path "$sdk\Lib\vulkan-1.lib")) { throw "Vulkan SDK not installed at $sdk" }
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=$sdk"
          Add-Content $env:GITHUB_PATH "$sdk\Bin"
          $loader = @("$sdk\Bin\vulkan-1.dll", "C:\Windows\System32\vulkan-1.dll") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $loader) { throw "vulkan-1.dll not found" }
          Copy-Item $loader src-tauri\vulkan-1.dll

      # The speech helper that runs Parakeet on Vulkan (src-tauri/engine), shipped as resources/engine.
      # A short build folder for the same path limit as the app's.
      - name: Build the speech helper
        env:
          ENGINE_TARGET_DIR: C:/te
          ENGINE_WORK_DIR: C:/ov
        run: scripts/build_engine.sh

      # transcribe-cpp's DLLs need the C++ and OpenMP runtimes; ship them next to the helper.
      - name: Add the C++ runtime to the speech helper
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          $ver = (Get-Content (Join-Path $vs "VC\Auxiliary\Build\Microsoft.VCRedistVersion.default.txt")).Trim()
          $redist = Join-Path $vs "VC\Redist\MSVC\$ver\x64"
          foreach ($pattern in @("Microsoft.VC*.CRT", "Microsoft.VC*.OpenMP")) {
            $dir = Get-ChildItem $redist -Directory -Filter $pattern | Sort-Object Name | Select-Object -Last 1
            if (-not $dir) { throw "$pattern not found under $redist" }
            Get-ChildItem $dir.FullName -Filter *.dll | Copy-Item -Destination src-tauri\engine-bundle
          }

      - name: Build Windows installers
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            bun run tauri build --bundles nsis,msi --config "$UPDATER_CONFIG"
          else
            bun run tauri build --bundles nsis,msi
          fi

      # The steps below read the build from src-tauri/target. The Rust cache can leave a folder there.
      - name: Link the build folder
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force src-tauri\target -ErrorAction SilentlyContinue
          New-Item -ItemType Junction -Path src-tauri\target -Target C:\t | Out-Null

      # The same app, packaged for the Microsoft Store (it switches its own updater off there).
      # Unsigned: the Store signs it on publish, so it is kept out of the GitHub Release.
      - name: Build Microsoft Store package
        shell: pwsh
        run: ./scripts/build_msix.ps1

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: bifaria-windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Upload Microsoft Store package
        uses: actions/upload-artifact@v4
        with:
          name: bifaria-microsoft-store
          path: src-tauri/target/release/bundle/msix/*.msix
          if-no-files-found: error

      - name: Attach to release
        if: env.IS_RELEASE == 'true'
        run: |
          shopt -s nullglob
          gh release upload "$GITHUB_REF_NAME" \
            src-tauri/target/release/bundle/nsis/*.exe \
            src-tauri/target/release/bundle/nsis/*.exe.sig \
            src-tauri/target/release/bundle/msi/*.msi \
            --clobber

  build-linux:
    name: Build Linux (.AppImage, .deb & .rpm)
    needs: [create-release, test]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            cmake \
            clang \
            pkg-config \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libvulkan-dev \
            glslc \
            spirv-headers \
            ocl-icd-libopencl1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            src-tauri/engine -> target

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck and lint frontend
        run: |
          bun run typecheck
          bun run lint

      # The speech helper that runs Parakeet on Vulkan (src-tauri/engine), shipped as resources/engine.
      - name: Build the speech helper
        run: scripts/build_engine.sh

      # NO_STRIP: linuxdeploy's own strip can't read some newer libraries (e.g. OpenVINO's) and fails.
      # LD_LIBRARY_PATH: linuxdeploy looks up the helper's libraries' own dependencies (OpenVINO's)
      # only in system folders and this path.
      - name: Build Linux packages
        env:
          NO_STRIP: "true"
          LD_LIBRARY_PATH: ${{ github.workspace }}/src-tauri/engine-bundle
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            bun run tauri build --verbose --bundles appimage,deb,rpm --config "$UPDATER_CONFIG"
          else
            bun run tauri build --verbose --bundles appimage,deb,rpm
          fi

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: bifaria-linux-packages
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

      - name: Attach to release
        if: env.IS_RELEASE == 'true'
        run: |
          shopt -s nullglob
          gh release upload "$GITHUB_REF_NAME" \
            src-tauri/target/release/bundle/appimage/*.AppImage \
            src-tauri/target/release/bundle/appimage/*.AppImage.sig \
            src-tauri/target/release/bundle/deb/*.deb \
            src-tauri/target/release/bundle/rpm/*.rpm \
            --clobber

  publish-update-manifest:
    name: Publish updater manifest (latest.json)
    needs: [build-macos, build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and upload latest.json
        run: bash scripts/make_update_manifest.sh "$GITHUB_REF_NAME"
