# bifaria-engine: runs speech models outside the app (as the Swift helper does for Core ML on the
# Mac), so transcribe-cpp's ggml never meets whisper-rs's copy and a GPU driver crash can't take
# Bifaria down. Its own build, not a workspace member, for the same reason.
[package]
name = "bifaria-engine"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "bifaria-engine"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
serde_json = "1"
# Loads eddy (OpenVINO) only when an OpenVINO device is picked (src/openvino.rs).
libloading = "0.8"

# As Handy ships it: Vulkan on Windows and Linux x64, the CPU code as per-ISA modules picked at run
# time, so a build made on CI's CPU still runs on any user's.
[target.'cfg(all(any(windows, target_os = "linux"), target_arch = "x86_64"))'.dependencies]
transcribe-cpp = { version = "=0.4.2", default-features = false, features = ["dynamic-backends", "vulkan"] }

# Parakeet's ONNX build on any DirectX 12 GPU. ONNX Runtime links in statically; copy-dylibs puts the
# DirectML.dll it needs (newer than Windows' own) in the build folder, and scripts/build_engine.sh
# ships it next to the helper.
[target.'cfg(windows)'.dependencies]
# The app's versions (src-tauri/Cargo.lock): parakeet-rs 0.3.8 doesn't build against ort rc.15.
parakeet-rs = { version = "=0.3.7", features = ["directml"] }
ort = { version = "=2.0.0-rc.13", features = ["copy-dylibs"] }

# GGUF models on the Mac's GPU (Metal) and CPU; Core ML stays with the Swift helper.
[target.'cfg(target_os = "macos")'.dependencies]
transcribe-cpp = { version = "=0.4.2", default-features = false, features = ["metal"] }

[profile.release]
debug = false
